name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    # WPF (net10.0-windows) のため Windows ランナーで実行する
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CoverCropper.slnx

      - name: Build
        run: dotnet build CoverCropper.slnx -c Release --no-restore

      - name: Build IconGenerator
        run: dotnet build tools/IconGenerator/IconGenerator.csproj -c Release

      - name: Test
        run: dotnet test CoverCropper.slnx -c Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Publish
        run: dotnet publish CoverCropper/CoverCropper.csproj -c Release -r win-x64 --self-contained false -o publish

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: CoverCropper-win-x64
          path: publish
